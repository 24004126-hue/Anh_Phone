<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhoneStore" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>PhoneStore - Thế Giới Smartphone Cao Cấp & Chính Hãng</title>
    <meta name="description" content="PhoneStore - Hệ thống bán lẻ điện thoại di động chính hãng iPhone, Samsung, Xiaomi, ROG Phone, OPPO với giá tốt nhất, bảo hành VIP 12 tháng 1 đổi 1." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("PWA Service Worker registered successfully! Scope:", reg.scope))
            .catch((err) => console.log("Service Worker registration skipped:", err.message));
        });
      }
    </script>
  </body>
</html>
